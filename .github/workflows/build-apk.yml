name: build-apk

# Push / PR: tests + test APK (artifact).  Tag vX.Y.Z: signed APK + AAB -> GitHub Release.
# Tag vX.Y.Z-something (e.g. v0.9.0-test): pre-release; uses the debug key if signing secrets are missing.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: Reference from app.py
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/reference/requirements.txt
      - name: Fetch pinned MiniLM model
        run: bash tools/fetch_model.sh
      - name: Install reference deps
        run: pip install -r tools/reference/requirements.txt
      - name: Build reference (fails if quantized model changes app.py decisions)
        run: |
          set -o pipefail
          python tools/reference/make_reference.py 2>&1 | tee reference.log
      - name: Report failure
        if: failure()
        run: |
          msg=$(tail -n 30 reference.log 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=reference failed::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: reference
          path: tools/reference/out/reference.json

  android:
    name: Test + build APK
    needs: reference
    runs-on: ubuntu-22.04
    env:
      AM_REQUIRE_PARITY: "1"
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Fetch pinned MiniLM model
        run: bash tools/fetch_model.sh
      - uses: actions/download-artifact@v4
        with:
          name: reference
          path: tools/reference/out

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; else v="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "AM_VERSION=$v" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${v#v}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != *-* ]]; then echo "FINAL_RELEASE=1" >> "$GITHUB_ENV"; fi

      - name: Signing key
        if: env.HAS_SIGNING == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Final release needs signing secrets
        if: env.FINAL_RELEASE == '1' && env.HAS_SIGNING != 'true'
        run: |
          echo "::error title=signing secrets missing::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in Settings > Secrets and variables > Actions (see VODIC-SR.md)."
          exit 1

      - name: Unit + parity tests
        run: |
          set -o pipefail
          gradle -p android :core:test --no-daemon 2>&1 | tee gradle-test.log

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          tasks=":app:assembleDebug"
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then tasks="$tasks :app:assembleRelease :app:bundleRelease"; fi
          gradle -p android $tasks --no-daemon 2>&1 | tee gradle-build.log
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/attack-mapper-${VERSION_NAME}-test.apk"
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/attack-mapper-${VERSION_NAME}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/attack-mapper-${VERSION_NAME}.aab"
          fi
          ls -la dist

      - name: Report failure
        if: failure()
        run: |
          for f in gradle-test.log gradle-build.log; do
            [ -f "$f" ] || continue
            grep -nE '^e: |^w: .*error|error:|FAILED|What went wrong|AssertionError|expected|Exception|Could not|> ' "$f" \
              | grep -v 'Deprecated Gradle' | head -n 60 > errs.txt || true
            [ -s errs.txt ] || tail -n 40 "$f" > errs.txt
            split -l 12 errs.txt chunk_
            for c in chunk_*; do
              msg=$(sed 's/%/%25/g' "$c" | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f::${msg}"
            done
            rm -f chunk_* errs.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: attack-mapper-apk
          path: dist/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            files="dist/attack-mapper-${VERSION_NAME}.apk dist/attack-mapper-${VERSION_NAME}.aab"
          else
            files="dist/attack-mapper-${VERSION_NAME}-test.apk"
          fi
          gh release create "$GITHUB_REF_NAME" $files $pre \
            --title "Attack Mapper ${VERSION_NAME}" \
            --notes "Android build of Attack Mapper ${VERSION_NAME}. Install: see VODIC-SR.md / README. Works offline; no internet permission."
